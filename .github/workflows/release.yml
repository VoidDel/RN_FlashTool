name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发时只产出构建物，不创建 Release，方便验证打包流程
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # 用较老的发行版构建，产物对 glibc 的要求更低
          - rid: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - rid: osx-x64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - rid: osx-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 解析版本号
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            label="$version"
          else
            # artifact 名字里不能带 '+'，手动触发时改用短 SHA 区分
            version="0.0.0-dev"
            label="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=RnFlashTool-$label-${{ matrix.rid }}" >> "$GITHUB_OUTPUT"
          echo "版本号: $version（包名: $label）"

      # 程序通过 RN_FLASHTOOL_VERSION 读到标签上的版本号，自升级靠它判断新旧
      - name: 构建
        env:
          RN_FLASHTOOL_VERSION: ${{ steps.meta.outputs.version }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 发行包是“解压即用”的目录，自升级也是整个目录覆盖，所以不用安装器。
      # 可执行文件名保持 RnFlashTool：C# 版 2.x 的自升级会检查它，名字不变才能直接升上来。
      - name: 组装
        run: |
          dist="dist/${{ matrix.rid }}"
          mkdir -p "$dist"
          exe=RnFlashTool
          [ "${{ runner.os }}" = "Windows" ] && exe=RnFlashTool.exe
          cp "target/${{ matrix.target }}/release/$exe" "$dist/"
          cp -r chips "$dist/chips"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md "$dist/"
          chmod +x "$dist/$exe"
          du -sh "$dist"

      # 仓库里自带的是 Windows 版 OpenOCD，只随 win-x64 一起分发；
      # 其它平台由程序内的“OpenOCD 版本管理”自行下载对应架构的包
      - name: 附带 OpenOCD（仅 Windows）
        if: matrix.rid == 'win-x64'
        run: cp -r openocd dist/${{ matrix.rid }}/openocd

      - name: 压缩
        run: |
          mkdir -p artifacts
          cd dist/${{ matrix.rid }}
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip -bso0 "../../artifacts/${{ steps.meta.outputs.name }}.zip" .
          else
            tar -czf "../../artifacts/${{ steps.meta.outputs.name }}.tar.gz" .
          fi
          cd ../..
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: artifacts/*
          retention-days: 14

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 程序自升级优先用 GitHub 给每个文件算的 digest 校验，这份清单是没有 digest 时的后备
      - name: 生成校验和
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<'EOF'
          ## 下载说明

          | 平台 | 文件 |
          | --- | --- |
          | Windows x64 | `RnFlashTool-<版本>-win-x64.zip`（已附带 OpenOCD，解压即用） |
          | Linux x64 | `RnFlashTool-<版本>-linux-x64.tar.gz` |
          | macOS Intel | `RnFlashTool-<版本>-osx-x64.tar.gz` |
          | macOS Apple Silicon | `RnFlashTool-<版本>-osx-arm64.tar.gz` |

          界面基于系统自带的 WebView：
          - Windows 10 / 11 已内置 WebView2，无需另装
          - Linux 需要 `libwebkit2gtk-4.1`（Ubuntu 22.04+ / Debian 12+ 可直接 `apt install libwebkit2gtk-4.1-0`）

          Windows 以外的平台没有附带 OpenOCD，首次启动后点击状态栏上的 OpenOCD
          在线下载对应架构的版本即可；Linux 下使用 USB 调试器通常还需要安装 udev 规则。

          macOS 首次运行若被 Gatekeeper 拦下（构建未签名），解压后执行：
          `xattr -dr com.apple.quarantine RnFlashTool`

          校验和见 `SHA256SUMS.txt`。
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "v$version" \
            --notes-file notes.md \
            --verify-tag \
            artifacts/*
