[package]
name = "rn-flashtool"
version = "3.1.0"
edition = "2024"
# let-chains（if let … && …）从 1.88 起稳定
rust-version = "1.88"
description = "RN FlashTool —— 基于 OpenOCD 的跨平台 MCU 烧录工具"
license = "MIT"
publish = false

# 可执行文件沿用 C# 版的名字：旧版自升级会检查安装包里是否有 RnFlashTool(.exe)，
# 并在替换后按原路径重新拉起，名字不变才能从 2.x 直接升级上来。
[[bin]]
name = "RnFlashTool"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol：直接 cargo build 也走内嵌的 ui/，而不是去连开发服务器
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread", "sync", "fs"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
