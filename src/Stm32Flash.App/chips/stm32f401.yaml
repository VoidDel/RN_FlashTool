# STM32F401 —— STM32 固件烧录工具芯片定义
#
# 本目录下每个 .yaml 文件描述一款（或一系列）芯片。
# 新增芯片：复制本文件改名，修改 id / name / targetConfig 即可，无需重新编译。
# 用户自定义目录：%APPDATA%\Stm32FlashTool\chips（同 id 会覆盖此处的内置定义）。

# 唯一标识，小写；同时作为手动输入型号时的默认匹配前缀
id: stm32f401

# 下拉列表中显示的名称
name: STM32F401

# 所属系列，用于下拉列表分组
series: STM32F4

# OpenOCD target 配置文件，相对于 OpenOCD 的 scripts 目录
targetConfig: target/stm32f4x.cfg

# 手动输入完整型号（如 stm32f401vgt6）时用于匹配的前缀，按最长前缀命中
matchPrefixes:
  - stm32f401

# 默认烧录起始地址
flashAddress: "0x08000000"

# 可选：Flash 容量。设置后“读取固件”会用它作为默认读取大小
# flashSize: "0x20000"

# 可选：调试器速度（kHz），设置后覆盖编程器接口的默认速度
# adapterSpeed: 4000

# 可选：追加到 OpenOCD 配置末尾的自定义命令
# extraConfigLines:
#   - "reset_config srst_only srst_nogate"

description: STM32F401（Cortex-M4）
